[project]
name = "resistivity-lab"
version = "0.1.0"
description = "Lock-in voltage and diode temperature acquisition for the resistivity lab"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
    "pyusb>=1.3,<2",
    "numpy>=2,<3",
    "pyvisa>=1.15,<2",
    "pyvisa-py>=0.8,<1",
    "libusb-package>=1.0.26,<2; sys_platform == 'win32'",
]

[tool.uv]
package = false
